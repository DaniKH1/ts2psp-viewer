[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ts2-psp-viewer"
version = "0.2.0"
description = "Local viewer and extractor for The Sims 2 PSP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "Pillow>=9.0"]

[project.scripts]
ts2-psp-viewer = "ts2psp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ts2psp = ["assets/**/*.png", "assets/**/*.ttf", "assets/*.ico"]
